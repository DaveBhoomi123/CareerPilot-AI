services:
  - type: web
    name: careerpilot-ai
    region: singapore
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn careerpilot.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 90
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: AI_DAILY_LIMIT
        value: "15"
