{% extends 'base.html' %}{% block title %}Forgot password · CareerPilot AI{% endblock %}
{% block content %}
<div class="auth-header"><div class="eyebrow">LET'S GET YOU BACK IN</div><h1>Forgot your password?</h1><p>Enter the email address registered with your account.</p></div>
<div class="panel auth-panel"><form method="post" data-busy>{% csrf_token %}{{ form.as_p }}<button type="submit" class="btn btn-primary w-100">Send reset link</button></form><p class="text-center mt-4 mb-0"><a href="{% url 'login' %}">Back to sign in</a></p></div>
{% endblock %}
